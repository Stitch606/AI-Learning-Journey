name: Download PYSKL Joint-Motion checkpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official checkpoint
        run: |
          set -euo pipefail
          mkdir -p GCN/PYSKL_STGCNPP_JM_COCO17_2D
          curl -fL --retry 3 \
            "https://download.openmmlab.com/mmaction/pyskl/ckpt/stgcnpp/stgcnpp_ntu60_xsub_hrnet/jm.pth" \
            -o GCN/PYSKL_STGCNPP_JM_COCO17_2D/jm.pth
          test "$(stat -c%s GCN/PYSKL_STGCNPP_JM_COCO17_2D/jm.pth)" -gt 1000000

      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GCN/PYSKL_STGCNPP_JM_COCO17_2D/jm.pth
          if git diff --cached --quiet; then
            echo "Checkpoint already committed."
            exit 0
          fi
          git commit -m "Add PYSKL ST-GCN++ 2D COCO-17 Joint Motion weights"
          git push
