name: ST-GCN++ NCNN Conversion Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/ncnn_pipeline/gcn_ncnn_preflight.py"
      - ".github/workflows/stgcnpp-ncnn-preflight.yml"
      - "huggingface-space/process/models/ST_GCN++.py"
      - "huggingface-space/process/weights/stgcnpp_jm_ntu60_xsub_hrnet_finetuned.pth"

permissions:
  contents: read

jobs:
  convert-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout main with LFS checkpoint
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install conversion and NCNN runtime
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch numpy pnnx ncnn

      - name: Verify the fine-tuned checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("huggingface-space/process/weights/stgcnpp_jm_ntu60_xsub_hrnet_finetuned.pth")
          if not p.is_file() or p.stat().st_size < 1024:
              raise SystemExit(f"Missing or incomplete checkpoint: {p}")
          print(f"Fine-tuned checkpoint present: {p.stat().st_size:,} bytes")
          PY

      - name: Convert ST-GCN++ and compare NCNN output against PyTorch
        run: python tests/ncnn_pipeline/gcn_ncnn_preflight.py

      - name: Upload conversion report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stgcnpp-ncnn-conversion-preflight
          path: artifacts/ncnn_gcn_preflight/
          if-no-files-found: warn
          retention-days: 14
