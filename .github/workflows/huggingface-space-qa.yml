name: Hugging Face Space QA

on:
  workflow_dispatch:
  push:
    paths:
      - "huggingface-space/**"
      - ".github/workflows/huggingface-space-qa.yml"

permissions:
  contents: read

jobs:
  space-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Gradio Space dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r huggingface-space/requirements.txt "gradio==6.31.0" gradio_client
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start Gradio Server
        run: |
          cd huggingface-space
          python app.py >/tmp/hf-space.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:7860/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:7860/health
          curl -fsS http://127.0.0.1:7860/ | grep -q "Human Action Detection"
          curl -fsS http://127.0.0.1:7860/static/styles/style.css >/dev/null
          curl -fsS http://127.0.0.1:7860/static/scripts/state.js >/dev/null
          curl -fsS http://127.0.0.1:7860/static/scripts/app.js >/dev/null
      - name: Test Gradio frame API
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import numpy as np
          from PIL import Image
          from gradio_client import Client, handle_file

          image = np.zeros((80, 120, 3), dtype=np.uint8)
          with tempfile.TemporaryDirectory() as folder:
              path = Path(folder) / "frame.png"
              Image.fromarray(image).save(path)
              client = Client("http://127.0.0.1:7860")
              result = client.predict(handle_file(str(path)), api_name="/receive_frame")
          assert result["status"] == "ok", result
          assert result["frame_shape"] == [80, 120, 3], result
          assert result["frame_dtype"] == "uint8", result
          assert result["model_connected"] is True, result
          assert result["annotated_frame"].startswith("data:image/jpeg;base64,"), result
          print("Gradio PIL -> NumPy frame API passed:", result)
          PY
      - name: Test complete video upload, processing, and in-page byte-range playback
        run: |
          python - <<'PY'
          import time
          import tempfile
          from pathlib import Path

          import cv2
          import numpy as np
          import requests

          base = "http://127.0.0.1:7860"
          with tempfile.TemporaryDirectory() as folder:
              source = Path(folder) / "integration-test.mp4"
              writer = cv2.VideoWriter(
                  str(source),
                  cv2.VideoWriter_fourcc(*"mp4v"),
                  12.0,
                  (320, 240),
              )
              assert writer.isOpened(), "Could not create the integration test video"
              for index in range(24):
                  frame = np.zeros((240, 320, 3), dtype=np.uint8)
                  cv2.rectangle(frame, (20 + index * 3, 30), (100 + index * 3, 210), (40, 150, 230), -1)
                  cv2.putText(frame, f"FRAME {index}", (20, 225), cv2.FONT_HERSHEY_SIMPLEX, 0.6, (255, 255, 255), 1)
                  writer.write(frame)
              writer.release()

              with source.open("rb") as video:
                  uploaded = requests.post(
                      base + "/api/analyze-video",
                      files={"file": (source.name, video, "video/mp4")},
                      timeout=60,
                  )
              assert uploaded.status_code == 202, (uploaded.status_code, uploaded.text)
              job_id = uploaded.json()["job_id"]
              deadline = time.time() + 240
              last_stage = None
              while time.time() < deadline:
                  response = requests.get(base + f"/api/analyze-video/{job_id}", timeout=20)
                  assert response.ok, (response.status_code, response.text)
                  status = response.json()
                  if status.get("stage") != last_stage:
                      print("Video job stage:", status.get("stage"), "progress:", status.get("progress"))
                      last_stage = status.get("stage")
                  if status["status"] == "failed":
                      raise AssertionError("Video analysis failed: " + status.get("error", "unknown error"))
                  if status["status"] == "completed":
                      break
                  time.sleep(1)
              else:
                  raise AssertionError("Video analysis did not complete within 240 seconds")

              assert status.get("output_ready") is True, status
              result_url = base + f"/api/analyze-video/{job_id}/result"
              # The website's video element must be able to request byte ranges,
              # and the server must retain the file across multiple player requests.
              first_range = requests.get(result_url, headers={"Range": "bytes=0-1023"}, timeout=30)
              assert first_range.status_code == 206, (first_range.status_code, first_range.headers, first_range.text[:500])
              assert first_range.headers.get("content-range", "").startswith("bytes 0-1023/"), first_range.headers
              assert len(first_range.content) == 1024, len(first_range.content)

              result = requests.get(result_url, timeout=60)
              assert result.status_code == 200, (result.status_code, result.text[:1000])
              assert result.headers.get("content-type", "").startswith("video/mp4"), result.headers
              assert len(result.content) > 1000, f"Output video is too small: {len(result.content)} bytes"
              second_range = requests.get(result_url, headers={"Range": "bytes=0-127"}, timeout=30)
              assert second_range.status_code == 206, (second_range.status_code, second_range.headers)
              assert len(second_range.content) == 128, len(second_range.content)
              output = Path(folder) / "annotated-result.mp4"
              output.write_bytes(result.content)
              capture = cv2.VideoCapture(str(output))
              assert capture.isOpened(), "Downloaded result is not a readable MP4"
              output_frames = int(capture.get(cv2.CAP_PROP_FRAME_COUNT))
              capture.release()
              assert output_frames > 0, "Downloaded result contains no frames"
              assert status["result"]["frames_analyzed"] == output_frames, status
              assert status["result"]["codec"] == "h264", status
              print("Full video pipeline passed:", {
                  "input_bytes": source.stat().st_size,
                  "output_bytes": len(result.content),
                  "output_frames": output_frames,
                  "codec": status["result"]["codec"],
              })
          PY
      - name: Capture and test desktop/mobile UI
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const errors = [];
            const page = await browser.newPage({ viewport: { width: 1280, height: 1170 } });
            page.on("pageerror", error => errors.push(error.message));
            await page.goto("http://127.0.0.1:7860/", { waitUntil: "networkidle" });
            if (await page.locator(".layout").count() !== 1) throw new Error("Dashboard did not render");
            for (const width of [1024, 1280, 1440, 1920]) {
              await page.setViewportSize({ width, height: 1000 });
              const geometry = await page.evaluate(() => {
                const rect = selector => {
                  const r = document.querySelector(selector).getBoundingClientRect();
                  return { x: r.x, right: r.right, width: r.width };
                };
                const video = rect(".video");
                const rail = rect(".right");
                const cards = [...document.querySelectorAll(".charts .chart")].map(el => ({
                  width: el.clientWidth, scrollWidth: el.scrollWidth
                }));
                return { video, rail, cards, pageOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth };
              });
              if (geometry.pageOverflow) throw new Error("Desktop horizontal overflow at " + width + "px");
              if (width >= 1400 && (geometry.video.width <= geometry.rail.width || geometry.rail.width > 390))
                throw new Error("Desktop video/side-rail proportions failed at " + width + "px: " + JSON.stringify(geometry));
              if (geometry.cards.some(card => card.scrollWidth > card.width + 2))
                throw new Error("Analysis cards overflow at " + width + "px: " + JSON.stringify(geometry.cards));
            }
            await page.setViewportSize({ width: 1440, height: 1170 });
            await page.screenshot({ path: "artifacts/hf-desktop-dark.png", fullPage: true });
            await page.locator("#themeToggle").click();
            if (await page.locator("html").getAttribute("data-theme") !== "light") throw new Error("Light theme failed");
            await page.screenshot({ path: "artifacts/hf-desktop-light.png", fullPage: true });
            await page.evaluate(() => window.ActionUI.setState({ fps: 31.4, people: [{ id: 1, person: "Person 1", action: "Walking", confidence: 0.97 }] }));
            if (await page.locator("#peopleCount").innerText() !== "1") throw new Error("UI state module failed");
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true });
            mobile.on("pageerror", error => errors.push(error.message));
            await mobile.goto("http://127.0.0.1:7860/", { waitUntil: "networkidle" });
            await mobile.screenshot({ path: "artifacts/hf-mobile-dark.png", fullPage: true });
            const overflow = await mobile.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
            if (overflow) throw new Error("Mobile horizontal overflow detected");
            if (errors.length) throw new Error(errors.join("\\n"));
            await browser.close();
            console.log("Hugging Face UI passed: desktop, light/dark, state module, mobile.");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload previews and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-space-previews
          path: |
            artifacts/
            /tmp/hf-space.log
          if-no-files-found: warn
          retention-days: 14
