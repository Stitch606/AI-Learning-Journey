name: NCNN YOLO every frame, direct GCN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/ncnn_pipeline/real_video_ncnn_experiments.py"
      - ".github/workflows/ncnn-yolo30-direct.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_NAME: "ncnn-yolo30-direct"
      MODE: "NCNN YOLO every frame, direct GCN (256x256)"
      REAL_PER_30: "30"
      USE_TRACKER: "0"
      USE_FLOW: "0"
      RESIZE_256: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      YOLO_VERBOSE: "false"
    steps:
      - name: Checkout main with fine-tuned checkpoint
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NCNN, PNNX and inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir numpy opencv-python-headless ultralytics torch pnnx ncnn

      - name: Verify project checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("huggingface-space/process/weights/stgcnpp_jm_ntu60_xsub_hrnet_finetuned.pth")
          if not p.is_file() or p.stat().st_size < 1024:
              raise SystemExit(f"Missing or incomplete fine-tuned checkpoint: {p}")
          print(f"Fine-tuned checkpoint ready: {p.stat().st_size:,} bytes")
          PY

      - name: Run ncnn-yolo30-direct
        run: python tests/ncnn_pipeline/real_video_ncnn_experiments.py

      - name: Upload experiment report and converted models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncnn-yolo30-direct-report
          path: |
            artifacts/ncnn-yolo30-direct/report.json
            artifacts/ncnn-yolo30-direct/models/
            artifacts/source_handwaving.avi
          if-no-files-found: warn
          retention-days: 14
