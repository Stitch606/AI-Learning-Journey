name: Deploy Browser YOLO ONNX WebGPU

on:
  push:
    branches: [main]
    paths:
      - "browser-yolo-ncnn/**"
      - ".github/workflows/deploy-browser-yolo-ncnn.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-browser-yolo-ncnn"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test resumable model download
        run: node --test browser-yolo-ncnn/tests/download.test.mjs

      - name: Export YOLO26n-Pose and ST-GCN++ FP16 ONNX models
        run: |
          python -m pip install --upgrade pip
          python -m pip install ultralytics onnx onnxruntime onnxconverter-common numpy
          python browser-yolo-ncnn/stgcn/export_onnx.py --verify
          python browser-yolo-ncnn/tools/export_model.py
          test -s browser-yolo-ncnn/model/yolo26n-pose-512-fp16.onnx
          test -s browser-yolo-ncnn/model/yolo26n-pose-512-fp32.onnx
          test -s browser-yolo-ncnn/model/stgcnpp_ntu60-fp16.onnx
          test -s browser-yolo-ncnn/model/stgcnpp_ntu60-fp32.onnx
          python - <<'PY'
          import json
          from pathlib import Path
          yolo = json.loads(Path("browser-yolo-ncnn/model/yolo-onnx-config.json").read_text())
          assert yolo["input_size"] == 512, yolo
          assert yolo["precision"].startswith("FP16"), yolo
          print("YOLO ONNX export verified at 512x512")
          PY

      - name: Install headless browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Download multi-person inference fixture
        run: |
          mkdir -p browser-yolo-ncnn/.ci
          curl -fL --retry 3 https://ultralytics.com/images/bus.jpg -o browser-yolo-ncnn/.ci/bus.jpg
          test -s browser-yolo-ncnn/.ci/bus.jpg

      - name: Run Chromium model, pose and renderer tests
        run: node browser-yolo-ncnn/tests/smoke_test.mjs

      - name: Remove CI-only fixture
        run: rm -rf browser-yolo-ncnn/.ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: browser-yolo-ncnn

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
