name: Deploy Browser YOLO NCNN to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "browser-yolo-ncnn/**"
      - ".github/workflows/deploy-browser-yolo-ncnn.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-browser-yolo-ncnn"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Export YOLO26n-Pose to NCNN FP16
        run: |
          python -m pip install --upgrade pip
          python -m pip install ultralytics ncnn pnnx==20260526
          python browser-yolo-ncnn/tools/export_model.py
          python browser-yolo-ncnn/wasm/inspect_model.py

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.12
          actions-cache-folder: "emsdk-cache"

      - name: Build NCNN WebAssembly SIMD and SIMD + Threads
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Tencent/ncnn.git "$RUNNER_TEMP/ncnn"
          COMMON_FLAGS=(
            -DCMAKE_BUILD_TYPE=Release
            -DNCNN_SIMPLEOCV=ON
            -DNCNN_RUNTIME_CPU=OFF
            -DNCNN_SSE2=ON
            -DNCNN_AVX=OFF
            -DNCNN_AVX2=OFF
            -DNCNN_VULKAN=OFF
            -DNCNN_BUILD_TOOLS=OFF
            -DNCNN_BUILD_EXAMPLES=OFF
            -DNCNN_BUILD_BENCHMARK=OFF
            -DNCNN_BUILD_TESTS=OFF
            -DNCNN_BUILD_SHARED_LIBS=OFF
          )

          # Compatibility build: works on GitHub Pages even without cross-origin isolation.
          emcmake cmake -S "$RUNNER_TEMP/ncnn" -B "$RUNNER_TEMP/ncnn/build-simd" \
            "${COMMON_FLAGS[@]}" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ncnn-install-simd" \
            -DNCNN_THREADS=OFF -DNCNN_OPENMP=OFF -DNCNN_SIMPLEOMP=OFF
          cmake --build "$RUNNER_TEMP/ncnn/build-simd" --parallel 4
          cmake --install "$RUNNER_TEMP/ncnn/build-simd"

          # Faster multi-core build for browsers with SharedArrayBuffer enabled.
          emcmake cmake -S "$RUNNER_TEMP/ncnn" -B "$RUNNER_TEMP/ncnn/build-simd-threads" \
            "${COMMON_FLAGS[@]}" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ncnn-install-simd-threads" \
            -DNCNN_THREADS=ON -DNCNN_OPENMP=ON -DNCNN_SIMPLEOMP=ON
          cmake --build "$RUNNER_TEMP/ncnn/build-simd-threads" --parallel 4
          cmake --install "$RUNNER_TEMP/ncnn/build-simd-threads"

      - name: Compile single-thread and multi-thread browser runtimes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p browser-yolo-ncnn/runtime

          compile_runtime() {
            local variant="$1"
            local install="$2"
            local output="$3"
            local threads="$4"
            local pool="$5"
            local thread_flags=()
            if [ "$threads" = "ON" ]; then
              thread_flags=(-pthread -sPTHREAD_POOL_SIZE="$pool")
            fi

            em++ browser-yolo-ncnn/wasm/pose_bridge.cpp \
              -I"$install/include/ncnn" \
              -L"$install/lib" \
              -lncnn \
              --no-entry \
              -O3 -msimd128 -DNDEBUG "${thread_flags[@]}" \
              -s MODULARIZE=1 \
              -s EXPORT_ES6=1 \
              -s EXPORT_NAME=createNcnnModule \
              -s ENVIRONMENT=worker \
              -s FILESYSTEM=1 \
              -s ALLOW_MEMORY_GROWTH=1 \
              -s INITIAL_MEMORY=134217728 \
              -s MAXIMUM_MEMORY=805306368 \
              -s STACK_SIZE=8388608 \
              -s EXPORTED_FUNCTIONS='["_malloc","_free","_init_model","_run_inference","_get_detection_count","_copy_detections"]' \
              -s EXPORTED_RUNTIME_METHODS='["FS","stringToUTF8","lengthBytesUTF8","HEAPU8","HEAPF32"]' \
              -o "browser-yolo-ncnn/runtime/$output.js"
            test -s "browser-yolo-ncnn/runtime/$output.js"
            test -s "browser-yolo-ncnn/runtime/$output.wasm"
            echo "Built $variant runtime: $output"
          }

          compile_runtime "SIMD single-thread fallback" "$RUNNER_TEMP/ncnn-install-simd" "ncnn" "OFF" "0"
          compile_runtime "SIMD multi-thread" "$RUNNER_TEMP/ncnn-install-simd-threads" "ncnn-threaded" "ON" "8"

      - name: Install headless browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Download multi-person inference fixture
        run: |
          mkdir -p browser-yolo-ncnn/.ci
          curl -fL --retry 3 https://ultralytics.com/images/bus.jpg -o browser-yolo-ncnn/.ci/bus.jpg
          test -s browser-yolo-ncnn/.ci/bus.jpg

      - name: Run real Chromium camera, model and renderer tests
        run: node browser-yolo-ncnn/tests/smoke_test.mjs

      - name: Remove CI-only fixture
        run: rm -rf browser-yolo-ncnn/.ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: browser-yolo-ncnn

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
