name: Export and Verify Browser ST-GCN++ ONNX

on:
  push:
    branches: [main]
    paths:
      - "browser-yolo-ncnn/stgcn/**"
      - "browser-yolo-ncnn/model/stgcnpp_ntu60_xsub_hrnet.pth"
      - ".github/workflows/export-stgcn-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU export and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy onnx onnxruntime onnxconverter-common

      - name: Export original two-person ST-GCN++ and compare outputs
        run: python browser-yolo-ncnn/stgcn/export_onnx.py --verify

      - name: Upload verified ONNX model
        uses: actions/upload-artifact@v4
        with:
          name: stgcnpp-ntu60-browser-onnx-fp16-fp32
          path: |
            browser-yolo-ncnn/model/stgcnpp_ntu60-fp16.onnx
            browser-yolo-ncnn/model/stgcnpp_ntu60-fp32.onnx
          if-no-files-found: error
          retention-days: 30
