name: Publish Fine-Tuned ST-GCN++ to Hugging Face Runtime

on:
  push:
    paths:
      - ".github/workflows/publish-finetuned-model.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified fine-tuning artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13620011310/zip" \
            -o /tmp/stgcnpp-finetuned.zip
          mkdir -p /tmp/stgcnpp-artifact
          unzip -q /tmp/stgcnpp-finetuned.zip -d /tmp/stgcnpp-artifact
          test -s /tmp/stgcnpp-artifact/finetune_outputs/stgcnpp_jm_ntu60_xsub_hrnet_finetuned.pth
          test -s GCN/STGCNPP/model_multi_person.py
          test -s GCN/STGCNPP/ntu60_labels.txt

      - name: Publish architecture, labels and fine-tuned weights
        run: |
          cp GCN/STGCNPP/model_multi_person.py "huggingface-space/process/models/ST_GCN++.py"
          cp GCN/STGCNPP/ntu60_labels.txt "huggingface-space/process/models/ntu60_labels.txt"
          cp /tmp/stgcnpp-artifact/finetune_outputs/stgcnpp_jm_ntu60_xsub_hrnet_finetuned.pth \
            "huggingface-space/process/weights/stgcnpp_jm_ntu60_xsub_hrnet_finetuned.pth"
          rm .github/workflows/publish-finetuned-model.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "huggingface-space/process/models/ST_GCN++.py" \
                  "huggingface-space/process/models/ntu60_labels.txt" \
                  "huggingface-space/process/weights/stgcnpp_jm_ntu60_xsub_hrnet_finetuned.pth" \
                  .github/workflows/publish-finetuned-model.yml
          git commit -m "Publish fine-tuned per-person ST-GCN++ model"
          git push origin HEAD:main
