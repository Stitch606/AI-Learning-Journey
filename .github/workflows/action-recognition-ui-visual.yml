name: Action Recognition UI + Gradio Bridge QA
on:
  workflow_dispatch:
  push:
    paths:
      - "Action-Recognition-UI/**"
      - ".github/workflows/action-recognition-ui-visual.yml"
permissions:
  contents: read
  actions: read
jobs:
  bridge-and-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Action-Recognition-UI/requirements.txt gradio_client
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start Gradio launcher
        run: |
          cd Action-Recognition-UI
          python app.py >/tmp/gradio-app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7860/gradio/ >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:7860/ui/ >/dev/null
      - name: Test real Gradio frame endpoint
        run: python Action-Recognition-UI/bridge-test.py
      - name: Capture and test UI
        run: |
          mkdir -p artifacts
          node Action-Recognition-UI/visual-test.cjs
      - name: Upload screenshots and backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-recognition-gradio-previews
          path: |
            artifacts/
            /tmp/gradio-app.log
          if-no-files-found: warn
          retention-days: 14
