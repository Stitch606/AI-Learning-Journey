name: Action Recognition Core Performance Test

on:
  workflow_dispatch:
    inputs:
      max_frames:
        description: "Maximum video frames to process"
        required: false
        default: "180"
  push:
    paths:
      - "huggingface-space/process/**"
      - "huggingface-space/benchmark_core.py"
      - ".github/workflows/action-recognition-core-benchmark.yml"

permissions:
  contents: read

jobs:
  core-benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4
          pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install "opencv-python-headless>=4.9" "ultralytics>=8.4.0"
      - name: Verify standalone core imports without loading the UI
        working-directory: huggingface-space
        run: |
          python - <<'PY'
          from pathlib import Path
          from process.streaming_inference import StreamingInference
          assert Path("process/weights/stgcnpp_jm_ntu60_xsub_hrnet_finetuned.pth").is_file()
          assert Path("process/models/ST_GCN++.py").is_file()
          print("Core imports and model assets: PASSED")
          PY
      - name: Run end-to-end real-video benchmark
        working-directory: huggingface-space
        env:
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
        run: |
          python benchmark_core.py --max-frames "${{ github.event.inputs.max_frames || '180' }}"
      - name: Upload benchmark report and sample video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-recognition-core-benchmark
          path: |
            huggingface-space/artifacts/core-benchmark/report.json
            huggingface-space/artifacts/core-benchmark/input.mp4
          if-no-files-found: warn
          retention-days: 14
