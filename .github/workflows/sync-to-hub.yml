name: Sync to Hugging Face Space

on:
  workflow_run:
    workflows: ["Hugging Face Space QA"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact QA-tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sync files to Hugging Face
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Conan112299/actions_detection
          hf_token: ${{ secrets.CHATGPT_SPACE_EDITOR }}
          subdirectory: huggingface-space
          space_sdk: gradio
