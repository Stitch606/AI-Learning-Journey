name: Fine-tune ST-GCN++ on precomputed HMDB51 skeletons

on:
  push:
    branches:
      - main
    paths:
      - "GCN/STGCNPP/train_hmdb51_transfer.py"
      - ".github/workflows/finetune-stgcnpp-hmdb51.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hmdb51-pose-transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU training dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4

      - name: Download precomputed HMDB51 COCO-17 skeleton annotations
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fL --retry 5 --retry-delay 5 \
            "https://download.openmmlab.com/mmaction/pyskl/data/hmdb51/hmdb51_hrnet.pkl" \
            -o data/hmdb51_hrnet.pkl
          test "$(stat -c%s data/hmdb51_hrnet.pkl)" -gt 10000000
          ls -lh data/hmdb51_hrnet.pkl

      - name: Fine-tune the existing ST-GCN++ backbone on 15 relevant HMDB51 classes
        run: |
          set -euo pipefail
          python GCN/STGCNPP/train_hmdb51_transfer.py

      - name: Upload trained checkpoint and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stgcnpp-hmdb51-pose-transfer
          path: |
            hmdb51_transfer_outputs/stgcnpp_hmdb51_pose_transfer_best.pth
            hmdb51_transfer_outputs/hmdb51_pose_transfer_report.json
          if-no-files-found: warn
          retention-days: 30
