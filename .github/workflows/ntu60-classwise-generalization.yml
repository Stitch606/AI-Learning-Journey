name: Diagnose ST-GCN++ class-wise generalization on NTU60

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/ntu60_classwise_generalization.py"
      - ".github/workflows/ntu60-classwise-generalization.yml"

permissions:
  contents: read

jobs:
  classwise-evaluation:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout main with LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4

      - name: Download official PYSKL NTU60 HRNet annotations
        run: |
          set -euo pipefail
          mkdir -p data/nturgbd
          curl -fL --retry 5 --retry-delay 5 \
            "https://download.openmmlab.com/mmaction/pyskl/data/nturgbd/ntu60_hrnet.pkl" \
            -o data/nturgbd/ntu60_hrnet.pkl
          test "$(stat -c%s data/nturgbd/ntu60_hrnet.pkl)" -gt 1000000
          ls -lh data/nturgbd/ntu60_hrnet.pkl

      - name: Evaluate original and fine-tuned checkpoints class by class
        run: python tests/ntu60_classwise_generalization.py

      - name: Upload class-wise report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntu60-classwise-generalization-report
          path: ntu60_classwise_generalization_report.json
          if-no-files-found: warn
          retention-days: 30
